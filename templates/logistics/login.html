<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Logistics Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: radial-gradient(circle at top, #1e293b, #070d18);
            padding: 20px;
        }
        .login-card {
            width: 100%;
            max-width: 440px;
            background: rgba(17, 24, 39, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-lg);
            padding: 40px;
            box-shadow: var(--shadow-lg);
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #3b82f6, #10b981);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin: 0 auto 16px;
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.4);
        }
        .demo-box {
            background: rgba(59, 130, 246, 0.08);
            border: 1px dashed rgba(59, 130, 246, 0.3);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            font-size: 0.8rem;
            color: #93c5fd;
            margin-top: 24px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <div class="login-icon">📦</div>
            <h2 style="font-size: 1.5rem; font-weight: 800; color: #fff;">Logistics Portal</h2>
            <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 4px;">Admin Control & Fleet Tracking</p>
        </div>

        {% if form.errors %}
        <div class="alert alert-error" style="margin-bottom: 20px;">
            <span>Invalid username or password. Please try again.</span>
        </div>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label" for="id_username">Admin Username</label>
                <input type="text" name="username" id="id_username" class="form-input" placeholder="admin" required autofocus>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="id_password">Password</label>
                <input type="password" name="password" id="id_password" class="form-input" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px; padding: 12px;">
                Secure Admin Sign In
            </button>
        </form>

        <div class="demo-box">
            🔑 <strong>Default Admin Credentials:</strong><br>
            Username: <code style="color:#fff;">admin</code> &nbsp;|&nbsp; Password: <code style="color:#fff;">admin123</code>
        </div>
    </div>
</body>
</html>
